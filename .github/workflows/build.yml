name: Build installers

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            platform: mac
            arch: x64
          - runner: macos-15
            platform: mac
            arch: arm64
          - runner: windows-2022
            platform: win
            arch: x64
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          architecture: ${{ matrix.arch }}
          cache: npm

      - name: Check architecture and release version
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          node -e "if (process.arch !== process.env.TARGET_ARCH) throw new Error('Node architecture does not match the build target'); const expected = 'v' + require('./package.json').version; if (process.env.GITHUB_REF_TYPE === 'tag' && process.env.GITHUB_REF_NAME !== expected) throw new Error('Release tag must match package.json: ' + expected)"

      - name: Install dependencies
        run: npm ci

      - name: Check types
        run: npm run typecheck

      - name: Build application and bundled runtime
        run: npm run build

      - name: Package installers
        run: npx electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never

      - uses: actions/upload-artifact@v7
        with:
          name: rea-desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Create draft release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: rea-desktop-*
          path: release
          merge-multiple: true

      - name: Upload installers to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft'); then
            if [ "$draft" != 'true' ]; then
              echo 'Refusing to replace assets of an already published release.' >&2
              exit 1
            fi
            gh release upload "$RELEASE_TAG" release/* --clobber
          else
            gh release create "$RELEASE_TAG" release/* \
              --draft --verify-tag --generate-notes --title "REA Desktop $RELEASE_TAG"
          fi
